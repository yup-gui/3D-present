version: "3.8"

services:
  frontend:
    image: nginx:stable-alpine
    container_name: 3d-present-frontend
    restart: always
    ports:
      # 左边的主机端口号可以按照你的需要修改 (例如 Nginx Proxy Manager 代理到了8000端口)
      # 右边 80 是 Nginx 容器内部的默认访问端口，不要更改
      - "12345:80"
    volumes:
      # 由于你使用 scp ./dist/. 将文件直接拷贝到了 ~/3D-present
      # 这个 compose 文件如果在同一目录下，那么直接把当前目录 (.) 挂载进去即可
      - ./:/usr/share/nginx/html:ro
